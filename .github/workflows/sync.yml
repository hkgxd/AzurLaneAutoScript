name: Upstream Sync
permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/guoh064/AzurLaneAutoScript.git
          git fetch upstream
          git checkout master
          git merge upstream/main -X theirs --no-edit || echo "Merge failed, skipping"
          git push origin master
